<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Proto — Gather-style walking office (PROTOTYPE)</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 -apple-system,Segoe UI,"Noto Sans TC",sans-serif;background:#0b0f16;color:#c9d1d9;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0d1117;border-bottom:1px solid #21262d;flex:0 0 auto}
#top b{font-size:14px}
#top .tag{font-size:11px;color:#8b949e;background:#161b22;border:1px solid #30363d;border-radius:999px;padding:1px 9px}
#top .proto{color:#ffb454;border-color:#5a4a24;background:#2a2113}
/* the two demo buttons these styled were removed 2026-07-28; rules deleted with them */

/* owner 2026-07-29:「還是給我滾動條，儘量確保上面的格子大小是一致的，已停的可以往下」。
   這推翻了 plan 原本的「版面固定滿版不滾動」——格子被壓到不同尺寸正是重疊的來源。
   垂直可捲，水平永遠不可捲（橫向捲軸才是 77e913b 那類真正的回歸）。 */
#stage{position:relative;width:100%;flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#16223322 0,transparent 70%),linear-gradient(180deg,#0b1017,#0e1522 60%,#111b29)}
/* 地板不再被視窗高度壓扁：低於 FLOOR_MIN_H(820) 就維持 820 並讓 #stage 捲動。
   改 relative+margin（原本是 absolute+inset）才會把捲動高度撐出來；它仍是房間／人形的
   定位祖先。這個高度公式必須和 JS 的 floorPx() 及 preflight 的 sh 三者一致。 */
#floor{position:relative;margin:24px;height:calc(max(100dvh - 41px, 820px) - 48px);
  border:2px solid #2b3a4a;border-radius:16px;
  background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,#ffffff05 0 1px,transparent 1px 44px),#0f1826;
  box-shadow:inset 0 0 80px #0008}

.room{position:absolute;border-radius:12px;border:1.5px solid var(--rc,#30363d);
  background:linear-gradient(180deg,var(--rf,#12203033),transparent 80%);overflow:hidden}
.room::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--rc,#30363d)}
.room .rlabel{position:absolute;top:6px;left:10px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--rc,#8b949e);text-transform:uppercase;opacity:.9}
.room .rcount{position:absolute;top:5px;right:8px;font-size:10px;font-weight:700;color:#0d1117;background:var(--rc,#8b949e);border-radius:999px;min-width:16px;text-align:center;padding:0 5px}
.room .rmore{position:absolute;bottom:4px;right:8px;font-size:10px;font-weight:700;color:var(--rc,#8b949e);background:#0d1117cc;border:1px solid var(--rc,#30363d);border-radius:999px;padding:0 5px;line-height:14px}
/* 待命區內部兩排：上排「等你回覆」(有 wait_kind)、下排「真閒置」(無 wait_kind) */
.room .band{position:absolute;left:9px;font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--rc,#8b949e);opacity:.8}
.room .band.wait{top:22px}
.room .band.idle{top:54%}
.room .bandline{position:absolute;left:6px;right:6px;top:50%;border-top:1px dashed var(--rc,#30363d);opacity:.45}
/* 桌子層：房間之上、人形之下（.person 有自己的 z-index），座標與座位同一套 floor 百分比 */
#desks{position:absolute;inset:0;pointer-events:none}
.furn{position:absolute;background:#1b2635;border:1px solid #2b3a4a;border-radius:5px}
.furn.desk{height:15px;border-radius:4px;background:linear-gradient(180deg,#243346,#1a2534)}
.furn.mon{height:9px;border-radius:2px 2px 0 0;background:#2b5a7a;border-color:#3d7ba0;box-shadow:0 0 6px #39c5cf55}
.furn.table{border-radius:40px;background:radial-gradient(circle,#243346,#1a2534);border-color:#2f4560}
.furn.chair{width:11px;height:11px;border-radius:50%;background:#22303f;border-color:#2f4560}
.furn.rack{background:repeating-linear-gradient(180deg,#1a2534 0 4px,#243346 4px 8px);border-color:#3a2a1a}
.furn.couch{height:16px;border-radius:9px;background:linear-gradient(180deg,#2a3446,#20293a);border-color:#33465c}
.furn.locker{width:20px;height:26px;border-radius:3px;background:linear-gradient(180deg,#26303c,#1a222c);border-color:#333d49}
.furn.locker::after{content:"";position:absolute;top:11px;left:3px;width:4px;height:4px;border-radius:50%;background:#3a4552}
.plant{position:absolute;font-size:15px;filter:saturate(.85) brightness(.95);opacity:.9;pointer-events:none}

/* ---- avatar = drawn per-session figure (identity token), free-moving ---- */
.person{position:absolute;width:60px;height:60px;margin:-56px 0 0 -30px;
  transform:scale(var(--ps,1));transform-origin:50% 93.333%;
  transition:left 1.35s cubic-bezier(.34,.02,.24,1),top 1.35s cubic-bezier(.34,.02,.24,1);z-index:5;will-change:left,top}
.person.mini{width:40px;height:40px;margin:-38px 0 0 -20px;transform-origin:50% 95%;z-index:4}
/* owner 2026-07-28「大代理/小代理 整體字體調大成 16」＋「字體跟圖不要重疊」。
   名牌改成錨在人形盒的正上方（bottom:100%），不再用寫死的 top:-15px —— 字級一變，
   固定 offset 就會吃進圖裡；bottom:100% 不管字多大都貼在圖的上緣外面。 */
.person .nameplate{position:absolute;bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:12px;font-weight:600;background:#161b22ee;border:1px solid #30363d;border-radius:999px;padding:1px 7px;
  display:flex;align-items:center;gap:5px;line-height:17px;z-index:6;
  /* 整張牌的寬度上限＝place() 依這個人的座位寬算出來的 --npw。夾在 .pname 上是不夠的：
     圓點／OS／家別徽章／padding 是固定寬度，名字縮到 0 這張牌仍比座位寬（實測 6 人時
     還是凸出房間 16px）。夾容器，讓 .pname 在裡面被擠掉。 */
  max-width:var(--npw,none)}
/* 子代理坐在父代理正下方（subXY），名牌再掛在自己頭上就正好壓到父代理的圖（實測疊 16px）。
   小人的名牌改掛在腳下，兩個圖之間就不再有字。 */
.person.mini .nameplate{font-size:12px;top:100%;bottom:auto;margin-top:3px;margin-bottom:0}
/* 兄弟子代理左右錯開：座距約 56px，兩邊各讓 30px＝拉開 116px，所以兄弟的名牌要收更窄
   （下面 .sib 的 pname 上限 64px，整張約 112px < 116px）。讓太多會頂出畫面左緣——
   實測讓 52px 時，最左邊那個父代理的子代理名牌就掉出視窗 29px。
   只在 .sib（真的有兄弟）時生效，單獨的子代理仍置中對齊自己的圖、用一般字寬。 */
.person.mini.sib .nameplate{transform:translateX(-50%) translateX(-30px)}
.person.mini.sib.alt .nameplate{transform:translateX(-50%) translateX(30px)}
.person.mini.sib .nameplate .pname{max-width:64px}
/* hover 展開的那一疊才是 16px（owner 指定）。靜止的名牌維持小字：19 個人同畫面時，
   靜止名牌一上 16px，名牌互疊從 2 組暴增到 29 組、最寬一處疊 308px、還有 2 張被視窗切掉
   （1920 實測），跟「不要重疊」直接衝突。 */
.person:hover .nameplate{font-size:16px;line-height:22px}
/* 頭上只留身分：狀態燈 + 名稱 + 家別字母。其餘徽章（機器／權限／模型／ctx／stale／專案／
   任務數／hook／子代理／相對時間）改成 hover 才展開 —— owner 2026-07-28「頭上多了不必要
   資訊請隱藏，那些多的可以 hover on 再顯示」。
   量到的問題：名牌 white-space:nowrap 又沒有寬度上限，最寬一張 536px 掛在 430px 的房間裡，
   往右吃掉隔壁區 161px、還被視窗切掉 116px（1920 寬實測）。
   注意：徽章仍然照常 render 進 DOM，這裡只藏視覺 —— preflight 的 personEl fixture 斷言的是
   innerHTML 字串（tools/preflight_ui.py:2707 plate()），改成不 render 會讓那批 check 全紅。
   任務進度（.tprog）是例外，owner 2026-07-28 指名要留在標題上：「3/10（第三項，組共十項）」。 */
.person .nameplate>span:not(.sdot):not(.em):not(.pname):not(.tprog){display:none}
/* hover 展開：owner「一行一個，不要全部擠一行」——改直向堆疊，一個徽章一列。 */
.person:hover .nameplate{flex-direction:column;align-items:flex-start;gap:3px;border-radius:10px;padding:5px 9px}
.person:hover .nameplate>span:not(.sdot):not(.em):not(.pname):not(.tprog){display:flex}
/* 名字本身也會擠：`some-long-project--worktrees-some-branch` 這種長專案名，藏完徽章
   還有 261px，會頂出房間、在離線列跟鄰居的名牌疊在一起（實測 3 組重疊）。收成省略號，
   hover 展開看全名。 */
/* 名字在被夾住的牌裡是可壓縮的那一段：min-width:0 是必要的，flex item 預設 min-width:auto
   會撐著不肯縮，容器的 max-width 就形同虛設。92px 是牌沒被夾時（--npw 未設）的原始上限。 */
.person .nameplate .pname{max-width:92px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
/* 座位窄到連「圓點＋幾個字」都放不下時，硬塞只會得到一張讀不出來又壓到隔壁的牌。
   整張收起，靠 hover 看（hover 同時解除寬度上限，見下面那條）。 */
.person.npnarrow .nameplate{display:none}
.person.npnarrow:hover .nameplate{display:flex}
.person.mini .nameplate .pname{max-width:92px}
/* （這裡原本有一條 .person.small 專用的 64px 上限，是 PR 區名牌凸出房間 7px 的特例補丁。
    改成上面那條依座位寬現算的 --npw 之後就多餘了 —— 同一個算式在 PR 區得出的正是 64px，
    而且它同時修好待命區 6 人時凸出 29px 的同一個毛病。特例刪掉，規則留一條。） */
/* hover 是「看清楚這是誰」的動作，所以連整張牌的座位寬上限一起解除 —— 只解 .pname
   會讓名字撐開卻被容器切掉，等於 hover 了還是看不到。 */
.person:hover .nameplate{max-width:none}
.person:hover .nameplate .pname{max-width:none}
/* 上方塞不下時往下開（class 由 hover 時實測決定，見檔案末端的 mouseover 委派）。
   大人小人共用，所以 .mini 的 top:100% 也走同一條規則；.mini.sib 的左右錯開是 transform，
   跟這裡的 top/bottom 不衝突。 */
/* class 名字不可以叫 flip：.flip 早就被 place() 拿去表示「這一步往左走」，控制的是
   精靈的鏡像（:144-145 的 --fx / scaleX(-1)）。共用同一個 class 會讓 hover 把往左走的
   角色翻回右邊，也會讓需要向下開名牌的角色被鏡像。名牌方向自己一個 class。 */
.person.npdown .nameplate{bottom:auto;top:100%;margin-top:5px;margin-bottom:0}
.person.mini.npdown .nameplate{margin-top:4px}
/* 展開後要蓋在鄰居上面，否則被隔壁的名牌／傢俱切掉 */
.person:hover{z-index:20}
.person:hover .nameplate{z-index:21}
.nameplate .sdot{width:6px;height:6px;border-radius:50%}
.nameplate .em{font-size:9px}
.nameplate .osi{font-size:9px;opacity:.85}
/* 來源機器徽章：顏色由後端 registry 帶進 style，這裡只管尺寸（比照 ui/dashboard.html machineBadge） */
.nameplate .machb{font-size:9px;font-weight:700;border-radius:999px;padding:0 5px}
.nameplate .tprog{font-size:9px;font-weight:700;color:#79c0ff}
.nameplate .ctxb{font-size:9px;font-weight:700;border-radius:999px;padding:0 5px}
/* >85% pulses, exactly like ui/dashboard.html's ctxBadge does */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f8514900}50%{box-shadow:0 0 0 4px #f8514922}}
.nameplate .ctxb.hot{animation:pulse 2s ease-in-out infinite}
/* 連線中斷（stale）不是「已停」：琥珀色警示，用色比照 ui/dashboard.html 的 stale 那段 */
.nameplate .staleb{font-size:9px;font-weight:700;color:#d29922;border:1px solid #d2992255;border-radius:999px;padding:0 5px}
/* 權限模式／hook 健康度：字形與顏色由 ui/dashboard.html 的 pmBadge／hookBadge 帶進 style，這裡只管尺寸 */
.nameplate .pmb,.nameplate .hookb{font-size:9px;font-weight:700}
/* 沒畫出來的子代理：配色沿用 ui/dashboard.html 那顆 🔬 子代理徽章的紫 */
.nameplate .subb{font-size:9px;font-weight:700;color:#d2b8ff;background:#a371f733;border-radius:999px;padding:0 5px}
/* 專案／模型／開放任務數／最後活動：ui/dashboard.html 的 rowsTbl 一直在畫這四個，顏色沿用它
   那一列（📁 專案膠囊、模型膠囊、.tbadge 的 ▤N、最右欄 .sub 的相對時間），這裡只管尺寸 */
.nameplate .projb{font-size:9px;font-weight:700;color:#58a6ff;background:#1f6feb22;border-radius:999px;padding:0 5px}
.nameplate .modelb{font-size:9px;font-weight:700;color:#d2b8ff;background:#a371f733;border-radius:999px;padding:0 5px}
.nameplate .tasksb{font-size:9px;font-weight:700;color:#8b949e;background:#21262d;border-radius:999px;padding:0 5px}
.nameplate .ageb{font-size:9px;color:#6e7681}
.person .taskbar{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:8px;color:#c9d1d9;background:#0d1117cc;border:1px solid #30363d;border-radius:999px;padding:0 4px;line-height:12px;z-index:6}
.person .taskbar.council{color:#39c5cf;border-color:#39c5cf66}
.person .taskbar.wait{color:#a371f7;border-color:#a371f766}
.person .taskbar.prs{color:#ff7b72;border-color:#ff7b7266}
.person.mini .taskbar{display:none}
.avatar{position:relative;width:100%;height:100%}
.cre-img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 2px #0009);transform-origin:50% 100%}
.shadow{position:absolute;left:50%;bottom:0;width:34px;height:9px;margin-left:-17px;border-radius:50%;background:#0009;filter:blur(2px);z-index:0}
.person.mini .shadow{width:24px;margin-left:-12px}
/* 同批啟動（後端 group_key）的地板光暈：比照 ui/dashboard.html 的 .floorglow
   （fill:var(--batch);opacity:.24）——同一次 launch 的人腳下是同一個顏色 */
.bglow{position:absolute;left:50%;bottom:-1px;width:42px;height:12px;margin-left:-21px;border-radius:50%;background:var(--batch,#30363d);opacity:.24;filter:blur(3px);z-index:0}
.person.mini .bglow{width:28px;height:8px;margin-left:-14px}
.vring{position:absolute;left:50%;bottom:-2px;width:40px;height:12px;margin-left:-20px;border-radius:50%;
  border:2px solid var(--vend,#30363d);opacity:.75;box-shadow:0 0 9px var(--vend,#30363d);z-index:0}
.person.mini .vring{width:26px;margin-left:-13px;height:8px}
.emblem{position:absolute;top:-2px;right:-3px;width:17px;height:17px;border-radius:50%;
  background:var(--vend,#30363d);border:2px solid #0d1117;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#0d1117;font-weight:800;z-index:6}
.person.mini .emblem{width:13px;height:13px;font-size:7px}
.person.st-stopped .cre-img{filter:grayscale(1) brightness(.6) drop-shadow(0 2px 2px #0009);opacity:.7}
/* walk = hop while gliding (static sprite has no legs to animate); idle = gentle bob */
@keyframes hop{0%,100%{transform:translateY(0) scaleX(var(--fx,1))}25%{transform:translateY(-5px) scaleX(var(--fx,1))}50%{transform:translateY(0) scaleX(var(--fx,1))}75%{transform:translateY(-3px) scaleX(var(--fx,1))}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1px) scale(1.015)}}
.person.walking .cre-img{animation:hop .42s ease-in-out infinite}
.person.st-working:not(.walking) .cre-img{animation:breathe 3.4s ease-in-out infinite}
.person.flip{--fx:-1}
.person.flip .cre-img{transform:scaleX(-1)}
@media(prefers-reduced-motion:reduce){.person{transition:none}.cre-img{animation:none!important}}
</style></head>
<body>
<div id="top">
  <b>🏢 Office</b>
  <span class="tag proto">連線中… 尚未取得真實資料</span>
  <span class="tag" id="clock">—</span>
</div>
<div id="stage"><div id="floor"></div></div>
<script>
// per-session identity = drawn figure. Each img is a data-URI SVG built right
// here — no image files ship with this repo. One silhouette (rounded body +
// head), 26 hues at even 360/26 spacing; only the hue tells figures apart.
// Prefer your own artwork? Drop PNGs into assets/avatars/ and point img at
// them — everything else (grayscale when stopped, flip, hop/breathe, hash
// assignment, subagent inheritance) only ever targets `.cre-img`.
const _creSVG = h => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">` +
  `<ellipse cx="32" cy="45" rx="16" ry="15" fill="hsl(${h} 72% 55%)" stroke="hsl(${h} 72% 34%)" stroke-width="2.5"/>` +
  `<circle cx="32" cy="21" r="12" fill="hsl(${h} 72% 62%)" stroke="hsl(${h} 72% 34%)" stroke-width="2.5"/>` +
  `<circle cx="27.5" cy="20" r="2.1" fill="#10131a"/><circle cx="36.5" cy="20" r="2.1" fill="#10131a"/>` +
  `</svg>`);
const CREATURES = [
  {key:'hue-000', img:_creSVG(0)},
  {key:'hue-014', img:_creSVG(14)},
  {key:'hue-028', img:_creSVG(28)},
  {key:'hue-042', img:_creSVG(42)},
  {key:'hue-055', img:_creSVG(55)},
  {key:'hue-069', img:_creSVG(69)},
  {key:'hue-083', img:_creSVG(83)},
  {key:'hue-097', img:_creSVG(97)},
  {key:'hue-111', img:_creSVG(111)},
  {key:'hue-125', img:_creSVG(125)},
  {key:'hue-138', img:_creSVG(138)},
  {key:'hue-152', img:_creSVG(152)},
  {key:'hue-166', img:_creSVG(166)},
  {key:'hue-180', img:_creSVG(180)},
  {key:'hue-194', img:_creSVG(194)},
  {key:'hue-208', img:_creSVG(208)},
  {key:'hue-222', img:_creSVG(222)},
  {key:'hue-235', img:_creSVG(235)},
  {key:'hue-249', img:_creSVG(249)},
  {key:'hue-263', img:_creSVG(263)},
  {key:'hue-277', img:_creSVG(277)},
  {key:'hue-291', img:_creSVG(291)},
  {key:'hue-305', img:_creSVG(305)},
  {key:'hue-318', img:_creSVG(318)},
  {key:'hue-332', img:_creSVG(332)},
  {key:'hue-346', img:_creSVG(346)},
];
// no-shell: every zone below has a REAL data source (see report/office2-zone-signal-study).
// coding/docs/testing <- work_kind=working + work_detail; cli <- /api/cli-bridge now_running;
// standby <- work_kind=standby; offline <- status stopped/stale; council <- work_council
// .in_council (monitor _council_state: dispatch marker on the live tail). Zones without a
// real signal (多模型對抗) are intentionally NOT drawn until their signal lands.
// Layout budget: fixed full-bleed, no scrolling -- 3 rows, 3+4+1 = 8 cells.
// 統一格線（owner 2026-07-29 選定 4欄×2列、第 8 格留空）。
// 先前是三種尺寸（31x44 x3、23x30 x4、98x18 x1）；被壓小的那幾格塞不下名牌，正是
// owner 看到「一直重複疊到」的來源。現在 7 個活動區「完全等大」——
// 欄寬 23.375 = (100 - 左右各 1 - 3 個 1.5 間距) / 4，列高一律 34。
// 已停/離線維持整排、放在格線下方，可以往下長（那一區人最多且最不需要精讀）。

function render(animate){

// ---- map real /api/status -> agents (session=creature, vendor=emblem, work_kind=zone) ----
function hashInt(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
// 同批啟動的顏色：後端的 group_key（monitor.py：同一次 launch 的所有 session 共用一個值）
// 就是 ui/dashboard.html 的 batchColor 用的鍵。調色盤原樣鏡一份它的 BATCH_PALETTE，
// office2 不自創第二套（比照 ROUTE_EVIDENCE：只鏡一份，漂移交給 preflight 抓）。
const BATCH_PALETTE=['#8156D8','#D08A32','#2B9A92','#C74B79'];
function batchColor(k){return BATCH_PALETTE[hashInt(String(k==null?'':k))%BATCH_PALETTE.length];}
// 展示序 A#：以前是這一輪的迴圈序號（n++），有 session 進出時整批重排；而 A# 同時是節點鍵，
// 重排等於把畫好的人形換給別的 session。後端 spawn 出來的列自帶 agent_idx（monitor.py 的
// spawn provenance），ui/dashboard.html 的 signalDeskOrdinals 就是拿它當固定號（agent_idx+1），
// office2 照做。沒有 agent_idx 的列（不是 autopilot 起的）才退回本輪序號，且一律避開已被
// 固定號佔走的數字——兩個 session 撞到同一個 A# 會共用同一個人形。
function officeOrdinals(rows){
  const fixed=new Set();
  const fix=rows.map(function(r){const ai=r.agent_idx;
    if(Number.isInteger(ai)&&ai>=0&&!fixed.has(ai+1)){fixed.add(ai+1);return ai+1;}
    return 0;});
  let next=1;
  return fix.map(function(o){if(o)return o;
    while(fixed.has(next))next++;
    fixed.add(next);return next++;});
}
// zone priority (fixed): offline > council > review > work_detail > standby
function zoneOf(r){if(r.status==='stopped'||r.status==='stale')return 'offline';
  if(r.work_council&&r.work_council.in_council)return 'council'; // 3AI 共議 (main agent only)
  if(r.work_review)return 'review';   // active reviewer/panel subagents (agentType)
  const wk=r.work_kind;if(wk==='cli_queue')return 'cli';if(wk==='standby')return 'standby';
  if(wk==='working'){const d=r.work_detail;return d==='docs'?'docs':d==='test'?'testing':'coding';}
  return 'standby';}
// CLI-bridge now_running -> helper tokens in the CLI-queue zone (real live pids only).
function mapCliBridge(cb){
  return ((cb&&cb.now_running)||[]).map(function(j){
    const vend=CLIVEND[String(j.agent||'').toLowerCase()]||'codex';
    return {id:'cli·'+j.agent+'·'+j.pid, label:'⚙'+j.agent, vend:vend,
      cre:hashInt(String(j.agent)+String(j.pid))%CREATURES.length,
      zone:'cli', st:'working', subs:[], helper:true};
  });
}
// /api/prs -> PR 區的小人（一個未關的 PR 一個人）。比照 mapCliBridge：它們不是 session，
// 只是借同一套人形畫法站在自己的區裡，所以帶 helper:true（不進 subs、不吃 session 徽章）。
// 造型沿用同一池 per-session 人形（與 session 同一個 CREATURES 註冊表），
// 只是 small:true 畫小一號；靠 repo#number 雜湊指派，同一個 PR 每次都是同一隻。
// vend 一律留空：PR 沒有 AI 家別，硬塞一個家別等於編造訊號（personEl 會落到中性的 '?' 徽章）。
function mapPRs(d){
  return (((d&&d.rows)||[])).map(function(p){
    const repo=String(p.repo||''), short=repo.indexOf('/')>=0?repo.slice(repo.indexOf('/')+1):repo;
    const key=repo+'#'+p.number;
    // 號碼放最前面：一格站 6 個時名牌只有 64px，repo 在前會把 "#135" 這個唯一識別
    // 的部分截掉（實測某些長名 repo）。號碼在前，截到的永遠是 repo 的尾巴。
    return {id:'pr·'+key, label:'#'+p.number+' '+short, vend:'',
      cre:hashInt(key)%CREATURES.length, zone:'pr', st:'standby', subs:[],
      helper:true, small:true,
      // 卡在哪：後端已分好桶，認不得的值不畫標籤（不退回猜一個狀態）
      prst:(PR_STATE[p.state]||'')+(p.draft?' · 草稿':''),
      // 滑上去才看得到完整標題與連結網址；名牌只留 repo #號，寬度才不會爆
      tip:(p.title||'')+(p.url?' — '+p.url:'')};
  });
}
// 空的 PR 區有三種完全不同的意思，區標題必須講得出是哪一種：真的沒有未關的 PR／GitHub
// 查不到（gh 沒裝、沒登入、斷網）／查失敗但還留著上次結果。後端已用 available/stale/note
// 把三者分開，這裡只負責說出來 —— 讓「查不到」長得像「沒有 PR」正是要避免的假訊號。
function prNote(d){
  const room=floor.querySelector('.room[data-zone="pr"]');if(!room)return;
  const lab=room.querySelector('.rlabel');if(!lab)return;
  const bad=!d||!d.available||d.stale;
  lab.textContent=bad?'PR ⚠':'PR';
  // 看到的是哪一組要講出來：同樣「3 個」，在 public 與 all 底下是完全不同的意思。
  const sc=PR_SCOPE[d&&d.scope]||'';
  room.title=!d?'讀不到 /api/prs（monitor 沒回應）'
    :d.stale?('GitHub 這輪查不到，顯示的是上一次的結果：'+(d.note||''))
    :d.available?('GitHub 上未關的 PR：'+(((d.rows||[]).length))+' 個'+(sc?'（'+sc+'）':''))
    :('查不到 GitHub PR：'+(d.note||''));

// stale 保留成自己的狀態（人形仍走 st-stopped 的灰化，比照 dashboard 把 stale 的姿勢當 stopped）
function stOf(s){return s==='stale'?'stale':s==='stopped'?'stopped':s==='waiting'?'waiting':s==='idle'?'standby':'working';}
// 子代理是後端自己的一列（monitor._mini_rows 每列自帶 vendor/status），不是父代理的影子。
// stOf 沒有白名單，未知／缺漏的值會落到 'working'——套在子代理身上就是「停掉的被畫成執行中」。
// 比照 dashboard 的 normalizeStatus（不認得就退回 idle，office2 的待命）與 normalizeVendor
// （不認得就退回未知 vendor，personEl 已有的 '?' 灰底）：兩者一律不向父代理繼承。
const ST_KNOWN=['running','idle','waiting','stopped','stale'];
function subSt(s){return stOf(ST_KNOWN.indexOf(s)>=0?s:'idle');}
function subVend(v){return CLIVEND[String(v==null?'':v).toLowerCase()]||'';}
function mapStatus(d){
  const out=[], raw=[];
  [['claude','cc'],['codex','codex'],['hermes','hermes'],['copilot','copilot'],['antigravity','antigravity']].forEach(function(b){
    (d[b[0]]||[]).forEach(function(r){if(r.session_id)raw.push({vend:b[1], row:r});});
  });
  // 先把整輪的展示序算出來（固定號優先），再建人：id 不再是「這一輪剛好第幾個」
  const ORD=officeOrdinals(raw.map(function(x){return x.row;}));
  raw.forEach(function(x, oi){
      const r=x.row, id='A'+ORD[oi];
      // 子代理的名牌先前只印序號（A5.1），跟父代理的名牌（印專案名）對不起來，owner
      // 2026-07-28：「只顯示 2.1 2.2 這種只能用造型判定」。帶上父代理正在顯示的同一個
      // 字串當前綴，名牌就自己說得出是誰的子代理。id 維持 A#.# 不動 —— preflight
      // (tools/preflight_ui.py:4873) 釘死了這個形狀，node map 也是拿它當 key。
      const subs=(r.mini_rows||[]).map((m,i)=>({id:id+'.'+(i+1),
        parent:r.label||(typeof r.sub==='string'?r.sub:'')||id, seq:i+1,
        vend:subVend(m&&m.vendor), st:subSt(m&&m.status)}));
      // 子代理真數：mini_rows 已被後端截頂，r.subagents 才是真數。取法沿用 dashboard 的
      // officeRows（`r.subagents||minis.length`）：後端沒給就退回畫得出身分的個數，不虛報。
      const subs_total=(typeof r.subagents==='number'&&r.subagents>0)?r.subagents:subs.length;
      out.push({id, vend:x.vend, cre:hashInt(String(r.session_id))%CREATURES.length,
        zone:zoneOf(r), st:stOf(r.status), subs, subs_total,
        // 同批啟動：後端 group_key（同一次 launch 的所有 session 一個值）就是 Signal Desk
        // batchColor 用的鍵；沒有就退回自己的 session，比照 ui/dashboard.html 的
        // groupKey:String(r.group_key||r.session_id) 同一條退路。
        batch:String(r.group_key||r.session_id),
        label:r.label||'',   // 哪一個 session（dashboard 用 esc(r.label)）；沒有才退回短 key／序號
        sub:typeof r.sub==='string'?r.sub:'',   // 短 session key（dashboard 深視圖連結的文字）
        // dashboard rowsTbl 一直在畫的四個列訊號：專案（與 label 相同時不畫）、模型、
        // 開放任務數（`tasks`，跟下面那個 task_total 進度是不同欄位）、最後活動時間
        // （ts 換相對時間、last 是原始 ISO，兩個都要才有 dashboard 那格的完整意思）
        project:typeof r.project==='string'?r.project:'',
        model:typeof r.model==='string'?r.model:'',
        tasks:typeof r.tasks==='number'?r.tasks:null,
        ts:(typeof r.ts==='number'&&r.ts>0)?r.ts:null,   // 負數／NaN 的 epoch 是壞值，當沒有
        last:typeof r.last==='string'?r.last:'',
        // 這一回合跑了多久（後端只在 running/waiting 給）：不是數字就當沒有，不編造時間
        elapsed:typeof r.elapsed==='number'?r.elapsed:null,
        os:r.os||'', machine:r.machine||'',   // OS/機器訊號（dashboard 已用，office2 先前漏接）
        // context window %：後端沒讀數時是 null（relay 列也可能整欄缺），只有真的是數字才畫 badge
        ctx: typeof r.ctx==='number' ? r.ctx : null,
        // cost axis: absolute tokens re-read per turn; only a real number draws
        ctx_tokens: typeof r.ctx_tokens==='number' ? r.ctx_tokens : null,
        // 失聯多久（秒）：只有 relay 列在快照過期時才有；不是數字就當沒有，絕不編造分鐘數
        stale_age: typeof r.stale_age==='number' ? r.stale_age : null,
        // hook 健康度 {hits,cancelled,errors}：relay 列整欄是 {}；次數的清洗在 hookBadge 裡
        hooks: (r.hooks&&typeof r.hooks==='object') ? r.hooks : null,

        pmode: typeof r.pmode==='string' ? r.pmode : '',
        wait: standbyWait(r),   // 待命區才有：等你回覆組的既有 label（無 wait_kind = 真閒置）
        route: routeEvidence(r),   // 分區證據：後端 work_reason 的既有文案（認不得就空字串）
        council: (r.work_council&&r.work_council.in_council)
                 ? (COUNCIL_PHASE[r.work_council.phase]||null) : null,
        // 進度三個數字一律驗型別再收：total 先前只做真值判斷，非數字（例如後端送字串）
        // 會原樣走到 personEl 的樣板字串裡變成 HTML；done 先前用 `||0`，缺值被硬轉成 0，
        // 於是「兩個進度欄位都沒有」的列還是畫得出 0/total，跟不編造數字的規矩相牴觸。
        task: (typeof r.task_total==='number'&&r.task_total>0)
              ? {done:typeof r.task_done==='number'?r.task_done:null,
                 total:r.task_total,
                 idx:typeof r.task_index==='number'?r.task_index:null,
                 cur:r.task_current||'', eta:r.task_eta||''} : null});
  });
  // Two DIFFERENT sessions sharing a sprite is a bug, not a cosmetic tradeoff: the sprite IS the
  // identity, and only a subagent is meant to look like its parent. hashInt(id)%N alone collides
  // even when the pool is larger than the headcount (measured 2026-07-28: 26 creatures, 12 real
  // sessions, 4 still sharing), so the hash is only the STARTING point — probe forward to the next
  // free creature. Deterministic: rows are walked in session-id order, so the same set of sessions
  // always yields the same assignment regardless of arrival order. Only with more sessions than
  // creatures does anything repeat, and then in a defined order rather than at random.
  // Inlined on purpose: the preflight fixtures brace-extract THIS function and run it standalone
  // under node, so it must not call a helper defined outside itself.
  const _creOrder=out.slice().sort(function(a,b){return String(a.id).localeCompare(String(b.id));});
  const _creUsed=new Set(), _creN=CREATURES.length;
  _creOrder.forEach(function(row){
    let i=(typeof row.cre==='number'?row.cre:0)%_creN;
    for(let step=0;step<_creN&&_creUsed.has(i);step++)i=(i+1)%_creN;
    if(_creUsed.size<_creN)_creUsed.add(i);
    row.cre=i;
  });
  return out;
}
let pollTimer=null;
async function poll(){
  try{
    const d=await fetch('/api/status').then(r=>r.json());
    MACHINES=d.machines||{};   // 機器登錄簿跟著狀態一起來（office2 不自備副本）
    LOCALM=d.local_machine||'';  // 本機是簿子上的哪一把鑰匙（本機列沒有 machine 欄）
    LOCALOS=d.local_os||'';      // 本機的 OS：用來分辨「本機列」與「掛載他機 root 的列」
    const mapped=mapStatus(d);
    let helpers=[];
    try{helpers=mapCliBridge(await fetch('/api/cli-bridge').then(r=>r.json()));}catch(e){}
    // PR 區：/api/prs 自己快取（後端依 poll_seconds），這裡跟其他區同一輪拉。抓不到就
    // 讓 PR 區留空 —— 空的 PR 區與「查不到」是兩件事，後端已用 available/stale 分開，
    // 區標題的 note 由 prNote() 說明，這裡絕不塞假的 PR。
    let prs=[];
    try{const pd=await fetch('/api/prs').then(r=>r.json());prs=mapPRs(pd);prNote(pd);}
    catch(e){prNote(null);}
    const all=mapped.concat(helpers, prs);
    AGENTS=all;render(true);   // includes the empty case: no sessions means an empty floor, not a demo
    document.querySelector('.proto').textContent=all.length
      ? 'LIVE · 你的真實 session'
      : 'LIVE · 目前沒有任何 session';
    clearTimeout(pollTimer);pollTimer=setTimeout(poll,Math.max(4,(d.poll_seconds||30))*1000);
  }catch(e){   // the monitor is unreachable: say so, never fall back to invented agents
    AGENTS=[];render(true);
    document.querySelector('.proto').textContent='⚠ 讀不到 /api/status — 畫面留空，不顯示假資料';
    clearTimeout(pollTimer);pollTimer=setTimeout(poll,15000);}
}

// 展開的名牌不可以被切掉（owner 2026-07-28「TOOLTIP 會被切到，要在最上層」）。
// z-index 治不了這個：切它的是 #stage 的 overflow:hidden，而 .person 帶著 transform
// （scale 算出來是 matrix(1,0,0,1,0,0)，不是 none），會變成 fixed 定位的 containing
// block —— 所以連 position:fixed 都逃不出那個裁切框。實測最上排的人 hover 時，面板
// 頂端在 -27px（超出視窗），比 #stage 上緣高 65px。
// 因此改成量出來再決定往哪邊開：上面塞不下就往下開。用 mouseover 委派（冒泡，
// 一個 listener 管全場，人形是每輪重建的所以不能各自綁）。
floor.addEventListener('mouseover', function(e){
  const p = e.target.closest && e.target.closest('.person');
  if (!p) return;
  // mouseover 會在同一個人的子元素之間反覆冒泡（名牌→圖→光暈…）。沒有這道 guard，
  // 每次移動都要 remove class + 讀兩個 rect，等於每個 mousemove 都逼一次同步 layout。
  // 只有「真的從外面進到這個人身上」才量。
  if (e.relatedTarget && p.contains(e.relatedTarget)) return;
  const np = p.querySelector('.nameplate');
  if (!np) return;
  p.classList.remove('npdown');        // 先還原，才量得到「原本要往上開」的真實高度
  const st = document.getElementById('stage').getBoundingClientRect();
  const r = np.getBoundingClientRect();
  // hover 樣式此刻已套用（mouseover 在 :hover 生效之後才派送），量到的就是展開後的盒
  if (r.top < st.top) p.classList.add('npdown');
});
floor.addEventListener('mouseout', function(e){
  const p = e.target.closest && e.target.closest('.person');
  if (p && !p.contains(e.relatedTarget)) p.classList.remove('npdown');
});
