<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Session Monitor</title><style>
:root{color-scheme:dark;--p1-ink:#E6EDF3;--p1-claude:#F0883E;--p1-codex:#58A6FF;--p1-batch:#8156D8}
body{font:14px/1.5 -apple-system,Segoe UI,sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:14px}
h1{font-size:18px;margin:0 0 4px}
.meta{color:#8b949e;font-size:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:0 4px}
.alertbar{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;line-height:1.3}
.alertbar.ok{background:#0f2a17;border:1px solid #2ea04326;color:#3fb950}
.alertbar.warn{background:#2a1f0a;border:1px solid #d2992233;color:#e3b341}
.alertbar.crit{background:#2a1115;border:1px solid #f8514933;color:#ff7b72;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f8514900}50%{box-shadow:0 0 0 4px #f8514922}}
.alertbar .chips{margin-left:auto;display:flex;gap:6px;font-weight:500;font-size:12px}
.alertbar .chip{background:#ffffff14;border-radius:999px;padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 14px}
.card h2{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:#e6edf3}
.card h2 .sub{font-size:11px;background:#21262d;border-radius:999px;padding:1px 8px}
.card[data-cid]>h2{cursor:pointer;justify-content:flex-start;gap:6px;user-select:none}
.card[data-cid]>h2::before{content:'▾';color:#8b949e;font-size:10px;flex:none}
.card.clps>h2::before{content:'▸'}
.card[data-cid]>h2 .sub{margin-left:auto}
.card.clps>*:not(h2){display:none}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
td{padding:4px 4px;border-bottom:1px solid #21262d;vertical-align:middle}
/* max-width was a fixed 200px, which at 1920 (5 cards abreast) made the row 413px wide
   inside a 339px card: the sha link and the age column were pushed outside the card and
   clipped. width:100% + max-width:0 makes this the elastic column — the fixed-width
   siblings take their natural width and the label ellipsises into whatever is left. */
td.l{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ctx{text-align:right;white-space:nowrap}
/* A bar track is a div with no intrinsic width, so under the rule above it is not one
   of the "fixed-width siblings" — the elastic label takes everything and the track
   collapses to 0, silently blanking every bar chart (measured: 8px cell, 0px track).
   A declared min-width is what makes it a real sibling. A percentage cannot work here:
   it would resolve against the cell, which is the thing being sized. */
.bartrack{min-width:min(700px,52vw)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.running{background:#3fb950;animation:live 2.4s ease-in-out infinite}
.idle{background:#d29922}
.stopped{background:#6e7681;box-shadow:inset 0 0 0 1px #8b949e55}
.waiting{background:#a371f7;animation:waitp 1.6s ease-in-out infinite}
.stale{background:#484f58;box-shadow:inset 0 0 0 1px #d2992288}
@keyframes live{0%,100%{box-shadow:0 0 0 2px #3fb95033}50%{box-shadow:0 0 0 5px #3fb95011}}
@keyframes waitp{0%,100%{box-shadow:0 0 0 2px #a371f744}50%{box-shadow:0 0 0 6px #a371f711}}
.tbadge{background:#21262d;color:#8b949e;border-radius:999px;padding:0 6px;font-size:11px}
.pbtn{background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer}
.pbtn:hover{background:#30363d}
/* KB 快速開圖的連結晶片：沿用 .pbtn 的形狀，但它是 <a> 不是 button */
.kblink{display:inline-block;background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:2px 10px;font-size:12px;text-decoration:none}
.kblink:hover{background:#30363d;text-decoration:underline}
.kblink.dead{color:#8b949e;border-style:dashed;cursor:not-allowed}
.pbtn.launch:hover{background:#1f6feb;color:#fff;border-color:#58a6ff;box-shadow:0 0 0 3px #58a6ff22;transform:translateY(-1px)}
.pbtn.xclose{color:#ff7b72}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ckcard{display:block;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit;transition:border-color .2s,transform .1s;position:relative;overflow:hidden}
.ckcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--edge,#30363d)}
.ckcard.running{--edge:#3fb950}.ckcard.waiting{--edge:#a371f7}.ckcard.idle{--edge:#d29922}
.ckcard:hover{border-color:var(--p1-codex);transform:translateY(-1px)}
.ckhd{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--p1-ink);margin-bottom:6px}
.ckhd b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cksrc{margin-left:auto;font-size:15px}.cksrc.claude{color:var(--p1-claude)}.cksrc.codex{color:var(--p1-codex)}
.ckmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:2px}
.cktool{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#e6edf3;word-break:break-all;line-height:1.4}
.cktxt{color:#8b949e;font-size:12px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ckft{margin-top:8px;display:flex;justify-content:flex-end}
.ckbanner{background:#2a1f0a;border:1px solid #d2992233;color:#e3b341;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:12px}
.ckcc{font-family:ui-monospace,Consolas,monospace;color:var(--p1-ink);background:#8156D822}
.cur{font-size:11px;color:#58a6ff;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
#grid2{margin-top:14px}
.sub{color:#6e7681}
.note{color:#6e7681;font-size:11px;margin-top:8px;opacity:.85}
.kpi{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.kpi span{background:#21262d;border-radius:4px;padding:2px 8px;font-size:12px}
@media(max-width:520px){
 body{padding:10px}
 .grid,.ckgrid{grid-template-columns:minmax(0,1fr);gap:10px}

 .bartrack{min-width:0}
 .card>div[style*="display:flex"]{flex-wrap:wrap}
 .card>div[style*="display:flex"]>*{min-width:0;overflow-wrap:anywhere}
 table,tbody,tr,td{display:block;width:100%}
 tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dot label ctx" "dot meta hooks";gap:0 8px;padding:7px 0;border-bottom:1px solid #21262d;align-items:center}
 td{border:0;padding:0}
 tr>td:nth-child(1){grid-area:dot}
 tr>td:nth-child(2){grid-area:label;max-width:none;font-size:13px;white-space:normal}
 tr>td:nth-child(3){grid-area:ctx;text-align:right;font-weight:600}
 tr>td:nth-child(4){grid-area:hooks;text-align:right}
 tr>td:nth-child(5){display:none}
 tr>td:nth-child(6){grid-area:meta;font-size:11px;color:#6e7681}
 #deletions tr{display:block;padding:7px 0}
 #deletions tr>td{display:block;width:100%;min-width:0;text-align:left}
 #deletions tr>td:nth-child(5),#deletions tr>td:nth-child(7){text-align:right}
 #deletions tr>td:nth-child(6),#deletions .tbadge{white-space:normal!important;overflow-wrap:anywhere}
 .viewtog{margin-left:0;max-width:100%;flex-wrap:wrap;overflow:visible;border-radius:8px}
 .viewtog button{flex:1 1 30%;min-width:0;padding-inline:8px}
 .alertbar .chips{flex-wrap:wrap}
}

<h1>🛰️ AI Session Monitor <span class="sub" style="font-weight:400;font-size:12px">read-only · zero-token</span></h1>
<div id="alertbar" class="alertbar ok" hidden></div>
<div class="meta" id="meta">loading…</div>
<div class="toolbar" id="toolbar"></div>
<div class="grid" id="grid1"></div>
<div class="grid" id="grid2"></div>

<div id="office" style="display:none"></div>

<script>

// silently kills the drill-down link here and the deep link in monitor.py's alerts.
// "Local" is not "from this box": claude_projects may include a mounted root owned by
// another machine (~/.claude-mac/projects), whose rows arrive with os='mac' and no

 if(t.dataset.rcp==='win'){_recapWindow=t.dataset.win;renderRecap(true);}
 else if(t.dataset.rcp==='mac'){PREFS.recapMac=PREFS.recapMac?0:1;savePrefs();renderRecap(true);}
 else if(t.dataset.rcp==='office'){PREFS.recapOffice=PREFS.recapOffice?0:1;savePrefs();renderRecap(true);}
 else if(t.dataset.rcp==='refresh'){renderRecap(true);}
});
// ---- cockpit view (option C): branded live-card grid, own light poll ----
let _ckLoop=false,_ckBusy=false,_ckMs=6000,_ckLast=null;
function ckSkeleton(){  // branded first-load placeholder — never a blank flash (UX-006)
 return '<div class="ckgrid">'+[0,1,2].map(function(){return '<div class="ckcard" style="opacity:.45"><div class="ckhd"><span class="dot idle"></span><b>載入中…</b></div><div class="ckmeta"><span class="chip">&nbsp;&nbsp;&nbsp;</span></div><div class="cktool"><span class="sub">連線中…</span></div></div>';}).join('')+'</div>';
}
function paintCockpit(d,banner){
 const el=document.getElementById('cockpit'),cards=(d&&d.cards)||[];
 const top=banner?'<div class="ckbanner">'+esc(banner)+'</div>':'';
 if(!cards.length){el.innerHTML=top+'<div class="sub" style="padding:24px;text-align:center">— 目前沒有活躍的 agent —</div>';return;}
 el.innerHTML=top+'<div class="ckgrid">'+cards.map(function(c){
  const v=c.live||{},href='/session/'+encodeURIComponent(c.session_id)+(TOKEN?'?token='+encodeURIComponent(TOKEN):'');
  const chips=[];
  if(c.cc)chips.push('<span class="chip ckcc" title="wt cockpit 視窗裡這個 pane 的標題也是這個名字 — 要打字就找它">'+esc(c.cc)+'</span>');
  if(c.pmode&&c.pmode!=='default')chips.push('<span class="chip">'+esc(c.pmode)+'</span>');
  if(c.ctx!=null)chips.push(ctxBadge(c.ctx));  // threshold-coloured: a 95% agent pops, not flat grey
  if(c.subagents)chips.push('<span class="chip" style="color:#d2b8ff;background:#a371f733">🔬'+c.subagents+'</span>');
  if(c.wait_kind)chips.push('<span class="chip" style="color:#a371f7">'+esc(c.wait_kind==='question'?'❓ 問你':c.wait_kind==='plan_review'?'📋 審 plan':'💬 等你')+'</span>');
  return '<a class="ckcard '+esc(c.status)+'" href="'+href+'">'+
   '<div class="ckhd">'+dot(c.status)+'<b title="'+esc(c.label||'')+'">'+esc(c.label||'(untitled)')+'</b>'+
     '<span class="cksrc" title="'+(c.source==='codex'?'Codex':'Claude Code')+'">'+(c.source==='codex'?'🟦':'🟧')+'</span></div>'+
   '<div class="ckmeta">'+chips.join('')+'</div>'+
   '<div class="cktool">'+(v.tool?((v.tool_done?'☑ ':'⚙ ')+esc(v.tool)+(v.target?' <span class="sub">→ '+esc(v.target)+'</span>':'')):'<span class="sub">— 無 tool 事件（tail 內）—</span>')+'</div>'+
   (v.text?'<div class="cktxt">💬 '+esc(v.text)+'</div>':'')+
   '<div class="ckft"><span class="sub">'+ago(c.ts)+' ago</span></div>'+
  '</a>';}).join('')+'</div>';
}
async function renderCockpit(){
 if(PREFS.view!=='cockpit'||document.hidden){_ckLoop=false;return;}  // owner exits -> loop dies
 if(!_ckBusy){_ckBusy=true;
  if(!_ckLast)document.getElementById('cockpit').innerHTML=ckSkeleton();  // first load only
  try{const d=await (await fetch('/api/cockpit'+(TOKEN?'?token='+encodeURIComponent(TOKEN):''))).json();
   _ckMs=Math.max(3000,(d.poll_seconds||6)*1000);_ckLast=d;paintCockpit(d);}
  catch(e){if(_ckLast)paintCockpit(_ckLast,'⚠ 重新連線中…');  // keep last-good cards, don't wipe (UX-008)
   else document.getElementById('cockpit').innerHTML='<div class="sub" style="padding:16px">連線失敗，重試中… '+esc(''+e)+'</div>';}
  _ckBusy=false;}
 setTimeout(renderCockpit,_ckMs);
}
function startCockpit(){if(_ckLoop)return;_ckLoop=true;renderCockpit();}  // single-owner guard
function render(d){if(!d)return;
 document.getElementById('meta').innerHTML='updated '+esc(d.generated)+' · 自動更新 '+d.poll_seconds+'s &nbsp;&nbsp; 圖例: '+Object.keys(d.machines||{}).map(machineBadge).join('');
 renderToolbar(d);renderAlert(d);
 let view=PREFS.view;
 const isCk=view==='cockpit',isOff=view==='office',isSvc=view==='services',isRcp=view==='recap',isDel=view==='deletions';
 const hideMain=isCk||isOff||isSvc||isRcp||isDel;
 document.getElementById('grid1').style.display=hideMain?'none':'';
 document.getElementById('grid2').style.display=hideMain?'none':'';
 document.getElementById('cockpit').style.display=isCk?'block':'none';
 document.getElementById('office').style.display=isOff?'block':'none';
 document.getElementById('services').style.display=isSvc?'block':'none';
 document.getElementById('recap').style.display=isRcp?'block':'none';
 document.getElementById('deletions').style.display=isDel?'block':'none';
 if(isCk)startCockpit();else if(isOff)renderOffice(d);else if(isSvc)renderServices();else if(isRcp)renderRecap();else if(isDel)renderDeletionsView();else renderText(d);
 applyTooltipLabels(document);
}
document.getElementById('toolbar').addEventListener('click',function(e){
 const s=e.target.closest('[data-src]'),v=e.target.closest('[data-v]');
 if(s){const k=s.dataset.src;PREFS.hidden[k]=PREFS.hidden[k]?0:1;savePrefs();render(LAST);}
 else if(v){PREFS.view=v.dataset.v;savePrefs();render(LAST);}
});
// G2: presets launch / retry / close — delegated (cards re-render every poll)
document.getElementById('grid2').addEventListener('click',async function(e){
 const b=e.target.closest('.pbtn');if(!b)return;
 if(b.dataset.kb==='retry'){_kbError='';loadKbToday();return;}
 if(b.classList.contains('xclose')){
  if(!confirm('關閉 session '+b.dataset.token+'？（mark-only、不強殺）'))return;
  try{const r=await opsPost('/api/ops/close',{token:b.dataset.token});alert((r.ok?'✓ ':'✗ ')+(r.msg||(r.ok?'closed':'failed')));}
  catch(err){alert('✗ '+err);}
  tick();return;}
 const body={preset:b.dataset.preset,launch_id:(crypto.randomUUID?crypto.randomUUID():(''+Date.now()+'-'+Math.floor(Math.random()*1e9)))};
 if(b.dataset.idx!=null&&b.dataset.idx!=='')body.agent_idx=+b.dataset.idx;
 if(!confirm('Launch preset「'+b.dataset.preset+'」'+(body.agent_idx!=null?'（重試 agent #'+body.agent_idx+'）':'')+'？會開新 wt 分頁。'))return;
 b.disabled=true;
 try{const r=await opsPost('/api/ops/launch_preset',body);alert((r.ok?'✓ ':'✗ ')+(r.msg||(r.ok?'queued':'failed')));}
 catch(err){alert('✗ '+err);}
 tick();
});
// Energy: poll + animate ONLY while the tab is visible. Hidden (other tab /
// minimised) -> stop fetching and pause animations -> ~0 CPU/disk. TG alerts are
// unaffected (driven server-side in alert_loop), so nothing is missed while away.
let timer=null;
async function tick(){
 if(document.hidden)return;
 const TOKEN=new URLSearchParams(location.search).get('token')||'';
 let d;try{d=await (await fetch('/api/status'+(TOKEN?'?token='+encodeURIComponent(TOKEN):''))).json()}catch(e){document.getElementById('meta').textContent='fetch failed, retrying… '+e;clearTimeout(timer);timer=setTimeout(tick,Math.min(pollMs,15000));return}
 LAST=d;pollMs=(d.poll_seconds||60)*1000;
 try{render(d)}catch(e){document.getElementById('meta').textContent='render error: '+e}
 clearTimeout(timer);timer=setTimeout(tick,pollMs);  // reschedule even if render() threw — never freeze the loop
}
document.addEventListener('visibilitychange',function(){
 document.body.classList.toggle('paused',document.hidden);
 if(document.hidden){clearTimeout(timer);}else{tick();}
});
tick();
</script></body></html>
